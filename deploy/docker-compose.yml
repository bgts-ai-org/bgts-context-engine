# Single PostgreSQL with Apache AGE + pgvector for local development.
# Usage: docker compose -f deploy/docker-compose.yml up -d

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Secure by default. `docker compose up --build` takes no --build-arg flag, so this
        # pass-through is the only way to reach the Dockerfile's escape hatch for build
        # environments behind a TLS-inspecting proxy: GIT_SSL_VERIFY=false docker compose ...
        GIT_SSL_VERIFY: ${GIT_SSL_VERIFY:-true}
    image: bce-postgres-age-pgvector:pg16
    container_name: bce-db
    environment:
      POSTGRES_USER: bce
      POSTGRES_PASSWORD: bce
      POSTGRES_DB: bce
    ports:
      - "5432:5432"
    volumes:
      - bce_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bce -d bce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bce_pgdata:
