[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgts-context-engine"
dynamic = ["version"]
description = "Deterministic code-graph context engine for AI coding agents - PostgreSQL, Apache AGE and pgvector, over MCP and REST"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Oğuz Öztürk" },
    { name = "Enes İyidil" },
]
maintainers = [
    { name = "BilgeAdam Technology" },
]
keywords = [
    "mcp",
    "mcp-server",
    "ai-agents",
    "context-engineering",
    "code-graph",
    "code-search",
    "codebase-indexing",
    "rag",
    "tree-sitter",
    "apache-age",
    "pgvector",
    "postgresql",
    "static-analysis",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.2.5",
    "typer>=0.12",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
# Agent-native MCP surface (spec section 7). Optional: the REST API works without it.
mcp = [
    "mcp>=1.0",
]
# Voyage AI embeddings (Phase 2). Optional: the hashing fallback works without it.
embed = [
    "voyageai>=0.3",
]
# Additional language grammars (Phase: language extension). Optional per deployment.
langs = [
    "tree-sitter-java>=0.21",
    "tree-sitter-c-sharp>=0.21",
    "tree-sitter-go>=0.21",
]

[project.scripts]
bce = "bce.cli:main"

[project.urls]
Homepage = "https://github.com/bgts-ai/bgts-context-engine"
Documentation = "https://github.com/bgts-ai/bgts-context-engine/tree/main/docs"
Repository = "https://github.com/bgts-ai/bgts-context-engine"
Issues = "https://github.com/bgts-ai/bgts-context-engine/issues"
Changelog = "https://github.com/bgts-ai/bgts-context-engine/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "bce.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bce*"]

[tool.setuptools.package-data]
bce = [
    "core/i18n/catalogs/*.json",
    "storage/relational/migrations/*.sql",
    # Compiled frontend served at /ui; vendored by scripts/build_ui.py before a release build.
    "api/rest/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer relies on calls (typer.Option) in argument defaults - intentional, not a bug.
ignore = ["E501", "B008"]
