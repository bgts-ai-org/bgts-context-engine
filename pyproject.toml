[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgts-context-engine"
version = "0.0.1"
description = "BGTS Context Engine (BCE) - deterministic, multi-language code-graph context engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Cortex" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.2.5",
    "typer>=0.12",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
# Agent-native MCP surface (spec section 7). Optional: the REST API works without it.
mcp = [
    "mcp>=1.0",
]
# Voyage AI embeddings (Phase 2). Optional: the hashing fallback works without it.
embed = [
    "voyageai>=0.3",
]
# Additional language grammars (Phase: language extension). Optional per deployment.
langs = [
    "tree-sitter-java>=0.21",
    "tree-sitter-c-sharp>=0.21",
    "tree-sitter-go>=0.21",
]

[project.scripts]
bce = "bce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer relies on calls (typer.Option) in argument defaults - intentional, not a bug.
ignore = ["E501", "B008"]
