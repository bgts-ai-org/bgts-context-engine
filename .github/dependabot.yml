version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: development
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      tree-sitter:
        patterns: ["tree-sitter*"]
      dev-tooling:
        patterns: ["pytest*", "ruff", "httpx"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    target-branch: development
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      build-tooling:
        patterns: ["vite", "vitest", "typescript", "@vitejs/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: development
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: monthly
    target-branch: development
    commit-message:
      prefix: "build(deps)"
